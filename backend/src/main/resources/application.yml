spring:
  jackson:
    # Forces Jackson to serialize Java camelCase field names (e.g., accessToken) to camelCase in JSON responses.
    # Jackson 3 (Spring Boot 4+) changed the default to snake_case (access_token), which broke our .http scripts
    # and would break our frontend too. This restores the conventional camelCase behaviour explicitly.
    property-naming-strategy: LOWER_CAMEL_CASE
#    serialization:
      # Prevents Java date/time types (LocalDateTime, etc.) from being serialized as ugly array timestamps
      # e.g., without this: [2026, 6, 25, 10, 30] — with this: "2026-06-25T10:30:00"
#      write-dates-as-timestamps: false

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:reform_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop #create/update/create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  data:
    redis:
      host: localhost
      port: 6379

# =========================================================================
# CUSTOM REFORM PLATFORM CONFIGURATIONS (Root Level)
# =========================================================================
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    secret: ${JWT_SECRET_KEY:default_dev_secret_key_reForm_platform_secret_2026_super_secure_256bit}
    expiration-ms: ${EXPIRATION_DURATION:3600000}
  rate-limiting:
    limits:
      ANONYMOUS:
        capacity: 10
        refill-tokens: 2
        refill-seconds: 10
      FORM_FILLER:
        capacity: 30
        refill-tokens: 5
        refill-seconds: 10
      FORM_BUILDER:
        capacity: 60
        refill-tokens: 10
        refill-seconds: 10
      ADMIN:
        capacity: 120
        refill-tokens: 20
        refill-seconds: 10

gemini:
  api:
    key: ${GEMINI_API_KEY}

deepgram:
  api:
    key: ${DEEPGRAM_API_KEY:DEFAULT_DEEPGRAM_KEY}

cartesia:
  api:
    key: ${CARTESIA_API_KEY:DEFAULT_CARTESIA_KEY}

voice:
  stt:
    default-strategy: DEEPGRAM_NOVA_3
    sample-rate: 16000
    channels: 1
    utterance-end-ms: 1000
  tts:
    default-strategy: CARTESIA_SONIC_3_5
    default-voice-id: a0e99841-438c-4a64-b679-ae501e7d6091

# =========================================================================
# SPRINGDOC OPENAPI & SWAGGER UI CONFIGURATION
# =========================================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  api-docs:
    path: /v3/api-docs



